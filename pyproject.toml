[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.1.0"
description = "A-share market data, indicators and lightweight analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28.0"]

[project.scripts]
quant-platform = "quant_platform.cli:main"

[tool.setuptools]
packages = ["quant_platform"]
